networks:
  ai-services:
    driver: bridge
  base:
    external: true
    name: base
volumes:
  comfyui-data: null
  invokeai-data: null
  dockge-data: null
  dockge-stacks: null
services:
  # ============================================
  # ComfyUI - AI Image Generation
  # ============================================
  comfyui:
    # Using YanWenKun's ComfyUI image (correct repository name)
    # Repository: https://github.com/YanWenKun/ComfyUI-Docker
    # Using cu128-megapak - CUDA 12.8 required for RTX PRO 6000 Blackwell (sm_120)
    image: ${COMFYUI_IMAGE:-yanwk/comfyui-boot:cu128-megapak}
    container_name: dhoch3-comfyui
    restart: unless-stopped
    networks:
      - base
      - ai-services
    ports:
      - ${COMFYUI_PORT:-8188}:8188
    volumes:
      # Shared models (READ-ONLY)
      - ${MODELS_PATH:-/vol/service/cw/storage-models/models}:/root/ComfyUI/models
      # Service data
      - comfyui-data:/app/ComfyUI
      # User outputs
      - ${USER_STORAGE_PATH:-/vol/service/cw/storage-user}/output/ComfyUI:/root/ComfyUI/output
      # User inputs (READ-ONLY)
      - ${USER_STORAGE_PATH:-/vol/service/cw/storage-user}/input:/root/ComfyUI/input
      # Workflows
      - ${USER_STORAGE_PATH:-/vol/service/cw/storage-user}/workflows:/root/ComfyUI/user/default/workflows
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      # Blackwell (sm_120) supports flash-attention natively with CUDA 12.8
      - CLI_ARGS=--disable-xformers
      # Better CUDA memory management
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    labels:
      - traefik.enable=true
      - traefik.docker.network=base
      # HTTP Router
      - traefik.http.routers.comfyui.entrypoints=websecure
      - traefik.http.routers.comfyui.rule=Host(`${COMFYUI_SUBDOMAIN:-comfyui}.app.${DOMAIN}`)
      - traefik.http.routers.comfyui.tls=true
      - traefik.http.services.comfyui.loadbalancer.server.port=8188
  # ============================================
  # Fooocus - AI Image Generation
  # ============================================
  fooocus:
    build:
      context: ./dockerfiles/fooocus
      dockerfile: Dockerfile
    image: dhoch3/fooocus:latest
    container_name: dhoch3-fooocus
    restart: unless-stopped
    networks:
      - base
      - ai-services
    ports:
      - ${FOOOCUS_PORT:-7860}:7860
    volumes:
      # Shared models (Fooocus resolves paths from /app/models/)
      - ${MODELS_PATH:-/vol/service/cw/storage-models/models}:/app/models
      # User outputs
      - ${USER_STORAGE_PATH:-/vol/service/cw/storage-user}/output/Fooocus:/app/outputs
      # User inputs (READ-ONLY)
      - ${USER_STORAGE_PATH:-/vol/service/cw/storage-user}/input:/app/inputs:ro
      # Workflows
      - ${USER_STORAGE_PATH:-/vol/service/cw/storage-user}/workflows:/app/workflows
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    labels:
      - traefik.enable=true
      - traefik.docker.network=base
      # HTTP Router
      - traefik.http.routers.fooocus.entrypoints=websecure
      - traefik.http.routers.fooocus.rule=Host(`${FOOOCUS_SUBDOMAIN:-fooocus}.app.${DOMAIN}`)
      - traefik.http.routers.fooocus.tls=true
      - traefik.http.services.fooocus.loadbalancer.server.port=7860
  # ============================================
  # Reforge Neo - Stable Diffusion WebUI Forge Classic (Neo Branch)
  # ============================================
  forge:
    build:
      context: ./dockerfiles/forge
      dockerfile: Dockerfile
    image: dhoch3/forge:latest
    container_name: dhoch3-forge
    restart: unless-stopped
    networks:
      - base
      - ai-services
    ports:
      - ${FORGE_PORT:-7861}:7861
    volumes:
      # Shared models (READ-ONLY) - symlinked to Forge naming in entrypoint
      - ${MODELS_PATH:-/vol/service/cw/storage-models/models}:/shared-models:ro
      # User outputs
      - ${USER_STORAGE_PATH:-/vol/service/cw/storage-user}/output/Forge:/outputs
      # User inputs (READ-ONLY)
      - ${USER_STORAGE_PATH:-/vol/service/cw/storage-user}/input:/inputs:ro
      # Workflows
      - ${USER_STORAGE_PATH:-/vol/service/cw/storage-user}/workflows:/app/workflows
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    labels:
      - traefik.enable=true
      - traefik.docker.network=base
      # HTTP Router
      - traefik.http.routers.forge.entrypoints=websecure
      - traefik.http.routers.forge.rule=Host(`${FORGE_SUBDOMAIN:-forge}.app.${DOMAIN}`)
      - traefik.http.routers.forge.tls=true
      - traefik.http.services.forge.loadbalancer.server.port=7861
  # ============================================
  # InvokeAI - AI Image Generation
  # ============================================
  invokeai:
    image: ${INVOKEAI_IMAGE:-ghcr.io/invoke-ai/invokeai:latest}
    container_name: dhoch3-invokeai
    restart: unless-stopped
    networks:
      - base
      - ai-services
    ports:
      - ${INVOKEAI_PORT:-9090}:9090
    volumes:
      # Service data (internal models, configs, database)
      - invokeai-data:/invokeai
      # User outputs (overlays volume at /invokeai/outputs)
      - ${USER_STORAGE_PATH:-/vol/service/cw/storage-user}/output/InvokeAI:/invokeai/outputs
      # Shared models (browse/import through InvokeAI UI)
      - ${MODELS_PATH:-/vol/service/cw/storage-models/models}:/shared-models:ro
      # User inputs (READ-ONLY)
      - ${USER_STORAGE_PATH:-/vol/service/cw/storage-user}/input:/invokeai/inputs:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    labels:
      - traefik.enable=true
      - traefik.docker.network=base
      # HTTP Router
      - traefik.http.routers.invokeai.entrypoints=websecure
      - traefik.http.routers.invokeai.rule=Host(`${INVOKEAI_SUBDOMAIN:-invokeai}.app.${DOMAIN}`)
      - traefik.http.routers.invokeai.tls=true
      - traefik.http.services.invokeai.loadbalancer.server.port=9090

  # ============================================
  # AI Toolkit - AI Training Tools with Web UI
  # ============================================
  ai-toolkit:
    build:
      context: ./dockerfiles/ai-toolkit
      dockerfile: Dockerfile
    image: dhoch3/ai-toolkit:latest
    container_name: dhoch3-ai-toolkit
    restart: unless-stopped
    networks:
      - base
      - ai-services
    ports:
      - ${AI_TOOLKIT_PORT:-8675}:8675
    volumes:
      # Shared models (READ-ONLY)
      - ${MODELS_PATH:-/vol/service/cw/storage-models/models}:/models:ro
      # Training outputs
      - ${USER_STORAGE_PATH:-/vol/service/cw/storage-user}/output/AIToolkit:/outputs
      # Training datasets (READ-ONLY) - dedicated datasets folder
      - ${USER_STORAGE_PATH:-/vol/service/cw/storage-user}/datasets:/datasets:ro
      # Workflows
      - ${USER_STORAGE_PATH:-/vol/service/cw/storage-user}/workflows:/workflows
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    labels:
      - traefik.enable=true
      - traefik.docker.network=base
      # HTTP Router
      - traefik.http.routers.ai-toolkit.entrypoints=websecure
      - traefik.http.routers.ai-toolkit.rule=Host(`${AI_TOOLKIT_SUBDOMAIN:-ai-toolkit}.app.${DOMAIN}`)
      - traefik.http.routers.ai-toolkit.tls=true
      - traefik.http.services.ai-toolkit.loadbalancer.server.port=8675
  # ============================================
  # Dockge - Container Management UI
  # ============================================
  dockge:
    image: ${DOCKGE_IMAGE:-louislam/dockge:latest}
    container_name: dhoch3-dockge
    restart: unless-stopped
    networks:
      - base
      - ai-services
    ports:
      - ${DOCKGE_PORT:-5001}:5001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dockge-data:/app/data
      - dockge-stacks:/opt/stacks
      - ${PWD}:/opt/stacks/dhoch3-ai-services
    environment:
      - DOCKGE_STACKS_DIR=/opt/stacks
    labels:
      - traefik.enable=true
      - traefik.docker.network=base
      # HTTP Router
      - traefik.http.routers.dockge.entrypoints=websecure
      - traefik.http.routers.dockge.rule=Host(`${DOCKGE_SUBDOMAIN:-dockge}.app.${DOMAIN}`)
      - traefik.http.routers.dockge.tls=true
      - traefik.http.services.dockge.loadbalancer.server.port=5001
